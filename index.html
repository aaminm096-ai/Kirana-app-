<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>MANSURI KIRANA - Business App</title>
<style>
*{box-sizing:border-box}html{min-height:100%;background:#f3f4f6}body{margin:0;min-height:100vh;padding-bottom:env(safe-area-inset-bottom);overscroll-behavior-y:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans Devanagari,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5;min-height:72px}
header h1{margin:0;font-size:21px}header p{margin:4px 0 0;color:#d1d5db;font-size:13px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px 8px;background:#fff;position:sticky;top:72px;z-index:4;box-shadow:0 2px 8px #0001}
nav button{border:0;background:#f3f4f6;border-radius:10px;padding:10px 4px;font-size:12px}nav button.active{background:#111827;color:#fff}
main{padding:12px 14px calc(20px + env(safe-area-inset-bottom));max-width:720px;margin:auto;min-height:calc(100vh - 72px)}.tab{display:none}.tab.active{display:block}
.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:14px;box-shadow:0 2px 10px #0000000b}
h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 9px}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;margin:5px 0 10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:10px;padding:13px 14px;min-height:46px;font-weight:700;background:#111827;color:white}.btn.secondary{background:#e5e7eb;color:#111827}.btn.green{background:#15803d}.btn.red{background:#b91c1c}.btn.full{width:100%}
.total{font-size:28px;font-weight:800;text-align:right;padding:10px 0}.muted{color:#6b7280;font-size:13px}
.item{display:grid;grid-template-columns:1fr 70px 95px 32px;gap:7px;align-items:center;margin-bottom:8px}.item input{margin:0}.item .amount{font-weight:700;text-align:right}.del{border:0;background:#fee2e2;color:#991b1b;border-radius:8px;height:38px}
.calc{background:#111827;padding:12px;border-radius:16px}.display{background:#000;color:#fff;text-align:right;padding:15px;border-radius:10px;font-size:30px;min-height:54px;margin-bottom:10px;overflow:auto}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keys button{padding:16px 5px;border:0;border-radius:10px;font-size:18px;font-weight:700;background:#374151;color:#fff}.keys button.op{background:#f59e0b}.keys button.eq{background:#16a34a}.keys button.clear{background:#dc2626}
.customer{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.actions .btn{flex:1;min-width:120px}.del-mini{border:0;background:#fee2e2;color:#991b1b;border-radius:8px;padding:8px 10px;font-weight:700}.customer b{font-size:16px}.balance{font-weight:800}.positive{color:#b91c1c}.paid{color:#15803d}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 5px;border-bottom:1px solid #eee;text-align:left}
.empty{padding:18px;text-align:center;color:#6b7280}
body>a[href*='netlify'],body>div>a[href*='netlify'],a[href*='netlify.app'][target='_blank']{display:none!important}
@media(max-width:480px){.row{grid-template-columns:1fr}.item{grid-template-columns:minmax(0,1fr) 58px 82px 38px}.card{padding:13px}.total{font-size:26px}nav button{font-size:11px;padding:9px 2px}}
@media print{
  @page{size:A4;margin:10mm}
  nav,header,.no-print{display:none!important}
  .tab{display:none!important}
  .tab.printable{display:block!important}
  body{background:#fff;color:#111}
  .card{box-shadow:none;border-radius:0;padding:0;margin:0}
  .bill-paper{width:100%;max-width:190mm;margin:0 auto}
  .bill-title{font-size:30px!important;font-weight:900!important;text-align:center;margin:0 0 12px!important;letter-spacing:.5px}
  .bill-meta{display:flex;justify-content:space-between;gap:20px;font-size:14px;margin:4px 0 10px}
  .bill-customer{font-size:17px;font-weight:800;border-top:1px solid #222;border-bottom:1px solid #222;padding:8px 0;margin:8px 0 12px}
  .bill-table{width:100%;border-collapse:collapse;font-size:14px}
  .bill-table th,.bill-table td{padding:8px 6px;border:1px solid #555}
  .bill-table th{font-weight:900;text-align:center}
  .bill-table td:nth-child(1),.bill-table td:nth-child(3),.bill-table td:nth-child(4),.bill-table td:nth-child(5){text-align:center}
  .bill-total{font-size:20px;font-weight:900;text-align:right;margin-top:10px}
}
</style>
</head>
<body>
<header><h1>MANSURI KIRANA</h1><p>Billing • Calculator • उधारी हिसाब</p></header>
<nav>
<button class="active" onclick="showTab('bill',this)">🧾 बिल</button>
<button onclick="showTab('calc',this)">🧮 कैलकुलेटर</button>
<button onclick="showTab('credit',this)">📒 उधारी</button>
<button onclick="showTab('history',this)">📊 हिस्ट्री</button>
</nav>
<main>

<section id="bill" class="tab active">
<div class="card">
<h2>नया बिल</h2>
<div class="row"><div><label>ग्राहक का नाम</label><input id="billCustomer" placeholder="जैसे: राहुल"></div><div><label>मोबाइल</label><input id="billPhone" inputmode="numeric" placeholder="मोबाइल नंबर"></div></div>
<div id="items"></div>
<button class="btn secondary full" onclick="addItem()">＋ सामान जोड़ें</button>
<div class="total">₹ <span id="grandTotal">0.00</span></div>
<div class="row">
<button class="btn green" onclick="saveBill(false)">💾 बिल सेव करें</button>
<button class="btn" onclick="saveBill(true)">🖨️ सेव + प्रिंट</button>
</div>
</div>
</section>

<section id="calc" class="tab">
<div class="card"><h2>कैलकुलेटर</h2>
<div class="calc"><div id="display" class="display">0</div>
<div class="keys">
<button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="op" onclick="press('/')">÷</button>
<button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="op" onclick="press('*')">×</button>
<button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="op" onclick="press('-')">−</button>
<button onclick="press('0')">0</button><button onclick="press('.')">.</button><button class="clear" onclick="clearCalc()">C</button><button class="op" onclick="press('+')">+</button>
<button class="eq" style="grid-column:span 4" onclick="calculate()">=</button>
</div></div></div>
</section>

<section id="credit" class="tab">
<div class="card">
<h2>उधारी खाता</h2>
<div class="row"><div><label>ग्राहक का नाम</label><input id="custName" placeholder="नाम"></div><div><label>मोबाइल</label><input id="custPhone" inputmode="numeric" placeholder="मोबाइल"></div></div>
<div class="row"><div><label>रकम</label><input id="custAmount" type="number" min="0" step="0.01" placeholder="₹"></div><div><label>प्रकार</label><select id="custType"><option value="due">उधारी बढ़ाएँ</option><option value="paid">जमा/वसूली</option></select></div></div>
<input id="custNote" placeholder="नोट (जैसे: किराना सामान)">
<button class="btn full" onclick="saveCredit()">उधारी सेव करें</button>
</div>
<div class="card"><h3>ग्राहक खोजें</h3><input id="creditSearch" oninput="renderCredits()" placeholder="नाम या मोबाइल से खोजें"><div id="credits"></div></div>
</section>

<section id="history" class="tab">
<div class="card">
<h2>बिल हिस्ट्री</h2>
<button class="btn secondary no-print" onclick="clearHistory()">सारी हिस्ट्री हटाएँ</button>
<div id="historyList"></div>
</div>
</section>

<section id="printArea" class="tab printable"></section>
</main>

<script>
let items=[];
let bills=JSON.parse(localStorage.getItem('mk_bills')||'[]');
let credits=JSON.parse(localStorage.getItem('mk_credits')||'{}');
function showTab(id,btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='credit')renderCredits();if(id==='history')renderHistory();}
function addItem(name='',qty=1,price=0){items.push({name,qty,price});renderItems();}
function renderItems(){let el=document.getElementById('items');el.innerHTML='';items.forEach((it,i)=>{el.innerHTML+=`<div class="item"><input placeholder="सामान का नाम" value="${esc(it.name)}" oninput="items[${i}].name=this.value"><input type="number" min="0" step="0.01" value="${it.qty}" oninput="items[${i}].qty=+this.value;updateTotal()"><input type="number" min="0" step="0.01" value="${it.price}" placeholder="रेट" oninput="items[${i}].price=+this.value;updateTotal()"><button class="del" onclick="items.splice(${i},1);renderItems()">×</button></div>`});updateTotal();}
function updateTotal(){let t=items.reduce((s,x)=>s+(+x.qty||0)*(+x.price||0),0);document.getElementById('grandTotal').textContent=t.toFixed(2);return t;}
function saveBill(print){let total=updateTotal();if(!items.length||total<=0){alert('कम से कम एक सामान और सही कीमत डालें।');return}let bill={id:Date.now(),date:new Date().toLocaleString('hi-IN'),customer:document.getElementById('billCustomer').value.trim()||'Cash Customer',phone:document.getElementById('billPhone').value.trim(),items:items,total};bills.unshift(bill);localStorage.setItem('mk_bills',JSON.stringify(bills));if(print){printBill(bill)}else alert('बिल सेव हो गया।');items=[];renderItems();document.getElementById('billCustomer').value='';document.getElementById('billPhone').value='';}
function printBill(b){
  let p=document.getElementById('printArea');
  const shopPhone='9754083323';
  p.innerHTML=`<div class="card"><div class="bill-paper">
    <h1 class="bill-title">MANSURI KIRANA</h1>
    <div class="bill-meta"><span>दिनांक: ${esc(b.date)}</span><span>मो.: ${shopPhone}</span></div>
    <div class="bill-customer">ग्राहक का नाम: ${esc(b.customer)}</div>
    ${b.phone?`<div style="font-size:14px;margin:-4px 0 10px">ग्राहक मोबाइल: ${esc(b.phone)}</div>`:''}
    <table class="bill-table"><tr><th>क्र.</th><th>सामान</th><th>मात्रा</th><th>रेट</th><th>रकम</th></tr>${b.items.map((x,i)=>`<tr><td>${i+1}.</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>₹${Number(x.price).toFixed(2)}</td><td>₹${(x.qty*x.price).toFixed(2)}</td></tr>`).join('')}</table>
    <div class="bill-total">कुल: ₹${b.total.toFixed(2)}</div>
  </div></div>`;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  p.classList.add('active');
  window.print();
  setTimeout(()=>{p.classList.remove('active');document.getElementById('bill').classList.add('active')},500);
}
function saveCredit(){let n=document.getElementById('custName').value.trim();let a=+(document.getElementById('custAmount').value||0);let ph=document.getElementById('custPhone').value.trim();let type=document.getElementById('custType').value;let note=document.getElementById('custNote').value.trim();if(!n||a<=0){alert('नाम और सही रकम डालें।');return}if(!credits[n])credits[n]={name:n,phone:ph,balance:0,history:[]};if(ph)credits[n].phone=ph;credits[n].balance += type==='due'?a:-a;credits[n].history.unshift({date:new Date().toLocaleString('hi-IN'),type,amount:a,note});localStorage.setItem('mk_credits',JSON.stringify(credits));document.getElementById('custAmount').value='';document.getElementById('custNote').value='';renderCredits();alert('उधारी हिसाब सेव हो गया।');}
function renderCredits(){let q=(document.getElementById('creditSearch')?.value||'').toLowerCase();let el=document.getElementById('credits');let arr=Object.values(credits).filter(c=>c.name.toLowerCase().includes(q)||(c.phone||'').includes(q));if(!arr.length){el.innerHTML='<div class="empty">अभी कोई उधारी खाता नहीं है।</div>';return}el.innerHTML=arr.map(c=>`<div class="customer"><b>${esc(c.name)}</b><div class="muted">${esc(c.phone||'मोबाइल नहीं')}</div><div class="balance ${c.balance>0?'positive':'paid'}">${c.balance>0?'लेना है':'जमा'}: ₹${Math.abs(c.balance).toFixed(2)}</div><div class="muted">${c.history?.[0]?esc(c.history[0].date)+' — '+(c.history[0].type==='due'?'उधारी':'जमा')+' ₹'+c.history[0].amount:''}</div><div class="actions"><button class="btn secondary" onclick="showCustomer('${encodeURIComponent(c.name)}')">पूरा हिसाब</button>${c.balance===0?`<button class="btn red" onclick="deleteCustomer('${encodeURIComponent(c.name)}')">🗑️ ग्राहक हटाएँ</button>`:''}</div></div>`).join('');}
function showCustomer(key){let c=credits[decodeURIComponent(key)];if(!c)return;let history=(c.history||[]).map((h,i)=>`${i+1}. ${h.date} — ${h.type==='due'?'उधारी':'जमा'} ₹${h.amount}${h.note?' ('+h.note+')':''}`).join('\n');let choice=prompt(c.name+'\nमो.: '+(c.phone||'-')+'\nवर्तमान हिसाब: ₹'+c.balance.toFixed(2)+'\n\n'+history+'\n\nEntry delete करने के लिए उसका नंबर लिखें, या Cancel दबाएँ।');if(choice===null||choice==='')return;let idx=Number(choice);if(Number.isInteger(idx)&&idx>=1&&idx<=c.history.length){if(!confirm('यह उधारी/जमा entry हटानी है?'))return;let h=c.history[idx-1];c.balance += h.type==='due' ? -h.amount : h.amount;c.history.splice(idx-1,1);localStorage.setItem('mk_credits',JSON.stringify(credits));renderCredits();}}
function deleteCustomer(key){let name=decodeURIComponent(key);let c=credits[name];if(!c)return;if(c.balance!==0){alert('जिस ग्राहक का हिसाब ₹0 नहीं है उसे हटाया नहीं जा सकता। पहले पूरा हिसाब करें।');return}if(!confirm(name+' का ग्राहक खाता हटाना है?'))return;delete credits[name];localStorage.setItem('mk_credits',JSON.stringify(credits));renderCredits();}
function renderHistory(){let el=document.getElementById('historyList');if(!bills.length){el.innerHTML='<div class="empty">अभी कोई बिल नहीं है।</div>';return}el.innerHTML='<table><tr><th>तारीख</th><th>ग्राहक</th><th>कुल</th><th>हटाएँ</th></tr>'+bills.slice(0,100).map(b=>`<tr><td>${esc(b.date)}</td><td>${esc(b.customer)}</td><td>₹${b.total.toFixed(2)}</td><td><button class="del-mini" onclick="deleteBill(${b.id})">🗑️</button></td></tr>`).join('')+'</table>';}
function deleteBill(id){if(!confirm('यह बिल हटाना है?'))return;bills=bills.filter(b=>b.id!==id);localStorage.setItem('mk_bills',JSON.stringify(bills));renderHistory();}
function clearHistory(){if(confirm('सारी बिल हिस्ट्री हटानी है?')){bills=[];localStorage.removeItem('mk_bills');renderHistory()}}
let expr='';function press(v){expr+=v;document.getElementById('display').textContent=expr}function clearCalc(){expr='';document.getElementById('display').textContent='0'}function calculate(){try{if(!/^[0-9+*/(). -]+$/.test(expr))throw 0;expr=String(Function('return '+expr)());document.getElementById('display').textContent=expr}catch(e){document.getElementById('display').textContent='गलत';expr=''}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
addItem();
</script>
</body></html>
